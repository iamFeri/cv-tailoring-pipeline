<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc"
     font-family="'Montserrat', 'Segoe UI', Arial, sans-serif">
  <title id="hero-title">CV Tailoring Pipeline — a self-hosted n8n build</title>
  <desc id="hero-desc">A self-hosted n8n pipeline that scrapes job postings, scores and tailors a CV with a schema-enforced AI call, then renders and delivers the PDF unattended: Scrape, Score + Tailor, Render, Deliver.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1B263B"/>
    </linearGradient>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#415A77" opacity="0.35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E0C26B"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#dotgrid)"/>

  <text x="56" y="54" font-size="14" letter-spacing="2.5" font-weight="700" fill="#778DA9">SELF-HOSTED N8N PIPELINE</text>
  <text x="56" y="104" font-size="40" font-weight="800" fill="#F8F8F5">CV Tailoring Pipeline</text>
  <text x="56" y="136" font-size="18" fill="#778DA9">Built one connected piece at a time — every piece is a real, working sub-workflow.</text>

  <!-- 4-card strip -->
  <g transform="translate(56 180)">
    <g stroke="#E0C26B" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="216" y1="44" x2="256" y2="44"/>
      <line x1="472" y1="44" x2="512" y2="44"/>
      <line x1="728" y1="44" x2="768" y2="44"/>
    </g>

    <g transform="translate(0 0)">
      <rect width="216" height="88" rx="12" fill="#1B263B" stroke="#415A77" stroke-width="1.5"/>
      <g transform="translate(178 10)" stroke="#E0C26B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <line x1="12.5" y1="12.5" x2="18" y2="18"/>
      </g>
      <text x="18" y="52" font-size="18" font-weight="700" fill="#F8F8F5">Scrape</text>
      <text x="18" y="72" font-size="13" fill="#778DA9">job postings</text>
    </g>
    <g transform="translate(256 0)">
      <rect width="216" height="88" rx="12" fill="#1B263B" stroke="#415A77" stroke-width="1.5"/>
      <path transform="translate(176 8)" d="M10,0 L12.4,7.6 L20,10 L12.4,12.4 L10,20 L7.6,12.4 L0,10 L7.6,7.6 Z" fill="#E0C26B"/>
      <text x="18" y="52" font-size="18" font-weight="700" fill="#F8F8F5">Score + Tailor</text>
      <text x="18" y="72" font-size="13" fill="#778DA9">one AI call</text>
    </g>
    <g transform="translate(512 0)">
      <rect width="216" height="88" rx="12" fill="#1B263B" stroke="#415A77" stroke-width="1.5"/>
      <g transform="translate(178 9)" stroke="#E0C26B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3,1 L12,1 L17,6 L17,19 L3,19 Z"/>
        <path d="M12,1 L12,6 L17,6"/>
        <line x1="6" y1="11" x2="14" y2="11"/>
        <line x1="6" y1="15" x2="14" y2="15"/>
      </g>
      <text x="18" y="52" font-size="18" font-weight="700" fill="#F8F8F5">Render</text>
      <text x="18" y="72" font-size="13" fill="#778DA9">LaTeX &#8594; PDF</text>
    </g>
    <g transform="translate(768 0)">
      <rect width="216" height="88" rx="12" fill="#1B263B" stroke="#415A77" stroke-width="1.5"/>
      <path transform="translate(176 9)" d="M1,9 L19,1 L11,19 L8.5,11.5 Z" fill="none" stroke="#E0C26B" stroke-width="1.6" stroke-linejoin="round"/>
      <line x1="184.5" y1="20.5" x2="195" y2="10" stroke="#E0C26B" stroke-width="1.6"/>
      <text x="18" y="52" font-size="18" font-weight="700" fill="#F8F8F5">Deliver</text>
      <text x="18" y="72" font-size="13" fill="#778DA9">Telegram &#183; Drive</text>
    </g>
  </g>

  <text x="56" y="372" font-size="13" fill="#415A77" font-family="'JetBrains Mono', ui-monospace, monospace">v6 &#183; 9 sub-workflows &#183; free-tier only &#183; zero manual intervention</text>
</svg>
